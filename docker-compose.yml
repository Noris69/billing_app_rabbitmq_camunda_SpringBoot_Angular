services:
  postgres:
    image: postgres:17
    container_name: billing-postgres
    environment:
      POSTGRES_DB: db_formation
      POSTGRES_USER: root
      POSTGRES_PASSWORD: moimoimm1
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db_formation"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: billing-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.17.6
    container_name: billing-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.17.6
    container_name: billing-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    entrypoint: /bin/sh
    command:
      - -c
      - |
        vault kv put secret/billing-customer \
          DB_URL='jdbc:postgresql://postgres:5432/db_formation' \
          DB_USERNAME='root' \
          DB_PASSWORD='moimoimm1' \
          KEYCLOAK_ISSUER_URI='http://localhost:8081/realms/billing'
        vault kv put secret/billing-invoice \
          DB_URL='jdbc:postgresql://postgres:5432/db_formation' \
          DB_USERNAME='root' \
          DB_PASSWORD='moimoimm1' \
          RABBITMQ_HOST='rabbitmq' \
          RABBITMQ_PORT='5672' \
          RABBITMQ_USERNAME='guest' \
          RABBITMQ_PASSWORD='guest' \
          KEYCLOAK_ISSUER_URI='http://localhost:8081/realms/billing'
        vault kv put secret/billing-payment \
          DB_URL='jdbc:postgresql://postgres:5432/db_formation' \
          DB_USERNAME='root' \
          DB_PASSWORD='moimoimm1' \
          RABBITMQ_HOST='rabbitmq' \
          RABBITMQ_PORT='5672' \
          RABBITMQ_USERNAME='guest' \
          RABBITMQ_PASSWORD='guest' \
          KEYCLOAK_ISSUER_URI='http://localhost:8081/realms/billing'
        vault kv put secret/api-gateway \
          BILLING_CUSTOMER_URI='http://billing-customer:8083' \
          BILLING_INVOICE_URI='http://billing-invoice:8080' \
          BILLING_PAYMENT_URI='http://billing-payment:8082' \
          KEYCLOAK_ISSUER_URI='http://localhost:8081/realms/billing'

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: billing-keycloak
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/db_formation
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: moimoimm1
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20

  billing-customer:
    build:
      context: ./billing-customer
    container_name: billing-customer
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/billing/protocol/openid-connect/certs
    ports:
      - "8083:8083"

  billing-invoice:
    build:
      context: ./billing-invoice
    container_name: billing-invoice
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/billing/protocol/openid-connect/certs
    ports:
      - "8080:8080"

  billing-payment:
    build:
      context: ./billing-payment
    container_name: billing-payment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/billing/protocol/openid-connect/certs
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: billing-api-gateway
    depends_on:
      billing-customer:
        condition: service_started
      billing-invoice:
        condition: service_started
      billing-payment:
        condition: service_started
      keycloak:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: root
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/billing/protocol/openid-connect/certs
    ports:
      - "8085:8085"

volumes:
  postgres-data:

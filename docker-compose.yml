services:
  postgres:
    image: postgres:17
    container_name: billing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: billing-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.17.6
    container_name: billing-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?VAULT_DEV_ROOT_TOKEN_ID is required}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.17.6
    container_name: billing-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?VAULT_DEV_ROOT_TOKEN_ID is required}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        vault kv put secret/billing-customer \
          DB_URL='jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}' \
          DB_USERNAME='${POSTGRES_USER:?POSTGRES_USER is required}' \
          DB_PASSWORD='${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}' \
          ZIPKIN_ENDPOINT='http://zipkin:9411/api/v2/spans' \
          KEYCLOAK_ISSUER_URI='${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI is required}'
        vault kv put secret/billing-invoice \
          DB_URL='jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}' \
          DB_USERNAME='${POSTGRES_USER:?POSTGRES_USER is required}' \
          DB_PASSWORD='${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}' \
          RABBITMQ_HOST='rabbitmq' \
          RABBITMQ_PORT='5672' \
          RABBITMQ_USERNAME='${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}' \
          RABBITMQ_PASSWORD='${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}' \
          ZIPKIN_ENDPOINT='http://zipkin:9411/api/v2/spans' \
          KEYCLOAK_ISSUER_URI='${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI is required}'
        vault kv put secret/billing-payment \
          DB_URL='jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}' \
          DB_USERNAME='${POSTGRES_USER:?POSTGRES_USER is required}' \
          DB_PASSWORD='${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}' \
          RABBITMQ_HOST='rabbitmq' \
          RABBITMQ_PORT='5672' \
          RABBITMQ_USERNAME='${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}' \
          RABBITMQ_PASSWORD='${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}' \
          ZIPKIN_ENDPOINT='http://zipkin:9411/api/v2/spans' \
          KEYCLOAK_ISSUER_URI='${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI is required}'
        vault kv put secret/api-gateway \
          BILLING_CUSTOMER_URI='http://billing-customer:8083' \
          BILLING_INVOICE_URI='http://billing-invoice:8080' \
          BILLING_PAYMENT_URI='http://billing-payment:8082' \
          ZIPKIN_ENDPOINT='http://zipkin:9411/api/v2/spans' \
          KEYCLOAK_ISSUER_URI='${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI is required}'

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: billing-zipkin
    ports:
      - "9411:9411"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: billing-keycloak
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20

  billing-customer:
    build:
      context: ./billing-customer
    container_name: billing-customer
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      zipkin:
        condition: service_started
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?VAULT_DEV_ROOT_TOKEN_ID is required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/billing/protocol/openid-connect/certs
    ports:
      - "8083:8083"

  billing-invoice:
    build:
      context: ./billing-invoice
    container_name: billing-invoice
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      zipkin:
        condition: service_started
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?VAULT_DEV_ROOT_TOKEN_ID is required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/billing/protocol/openid-connect/certs
    ports:
      - "8080:8080"

  billing-payment:
    build:
      context: ./billing-payment
    container_name: billing-payment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      zipkin:
        condition: service_started
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?VAULT_DEV_ROOT_TOKEN_ID is required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/billing/protocol/openid-connect/certs
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: billing-api-gateway
    depends_on:
      billing-customer:
        condition: service_started
      billing-invoice:
        condition: service_started
      billing-payment:
        condition: service_started
      keycloak:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      zipkin:
        condition: service_started
    environment:
      VAULT_URI: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?VAULT_DEV_ROOT_TOKEN_ID is required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/billing/protocol/openid-connect/certs
    ports:
      - "8085:8085"

volumes:
  postgres-data:

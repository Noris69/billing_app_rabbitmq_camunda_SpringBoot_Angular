server:
  port: 8082

spring:
  application:
    name: billing-payment
  config:
    import: optional:vault://

  cloud:
    config:
      enabled: false
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:root}
      kv:
        enabled: true
        backend: secret
        application-name: billing-payment

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: payment
    default-schema: payment
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

billing:
  rabbitmq:
    exchange: billing.exchange
    payment-requested-queue: payment.requested.queue
    payment-completed-queue: invoice.payment.completed.queue
    payment-requested-routing-key: payment.requested
    payment-completed-routing-key: payment.completed

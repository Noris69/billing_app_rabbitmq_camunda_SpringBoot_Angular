spring:
  application:
    name: billing-invoice
  config:
    import: optional:vault://

  cloud:
    config:
      enabled: false
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:root}
      kv:
        enabled: true
        backend: secret
        application-name: billing-invoice

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: invoice
    default-schema: invoice
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

camel:
  dataformat:
    jackson:
      auto-discover-object-mapper: true

billing:
  rabbitmq:
    exchange: billing.exchange
    payment-requested-queue: payment.requested.queue
    payment-completed-queue: invoice.payment.completed.queue
    payment-requested-routing-key: payment.requested
    payment-completed-routing-key: payment.completed

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

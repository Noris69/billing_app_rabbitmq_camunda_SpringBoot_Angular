server:
  port: 8085

spring:
  application:
    name: api-gateway
  config:
    import: optional:vault://

  cloud:
    config:
      enabled: false
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:root}
      kv:
        enabled: true
        backend: secret
        application-name: api-gateway
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:4200
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Authorization
            allow-credentials: true
      routes:
        - id: billing-customer-api
          uri: ${BILLING_CUSTOMER_URI:http://localhost:8083}
          predicates:
            - Path=/customer-api/**
          filters:
            - RewritePath=/customer-api/(?<segment>.*), /api/$\{segment}

        - id: billing-customer-direct
          uri: ${BILLING_CUSTOMER_URI:http://localhost:8083}
          predicates:
            - Path=/api/customers/**

        - id: billing-payment-api
          uri: ${BILLING_PAYMENT_URI:http://localhost:8082}
          predicates:
            - Path=/payment-api/**
          filters:
            - RewritePath=/payment-api/(?<segment>.*), /api/$\{segment}

        - id: billing-payment-direct
          uri: ${BILLING_PAYMENT_URI:http://localhost:8082}
          predicates:
            - Path=/api/payments/**

        - id: billing-invoice-api
          uri: ${BILLING_INVOICE_URI:http://localhost:8080}
          predicates:
            - Path=/api/invoices/**,/api/creanciers/**,/api/points-de-vente/**,/api/point-de-vente/**,/api/workflows/**

        - id: billing-customer-docs
          uri: ${BILLING_CUSTOMER_URI:http://localhost:8083}
          predicates:
            - Path=/customer-docs/**
          filters:
            - RewritePath=/customer-docs/(?<segment>.*), /$\{segment}

        - id: billing-invoice-docs
          uri: ${BILLING_INVOICE_URI:http://localhost:8080}
          predicates:
            - Path=/invoice-docs/**
          filters:
            - RewritePath=/invoice-docs/(?<segment>.*), /$\{segment}

        - id: billing-payment-docs
          uri: ${BILLING_PAYMENT_URI:http://localhost:8082}
          predicates:
            - Path=/payment-docs/**
          filters:
            - RewritePath=/payment-docs/(?<segment>.*), /$\{segment}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: Customer service
        url: /customer-docs/v3/api-docs
      - name: Invoice service
        url: /invoice-docs/v3/api-docs
      - name: Payment service
        url: /payment-docs/v3/api-docs
